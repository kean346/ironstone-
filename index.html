<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20231f">
  <meta name="description" content="Ironstone brings enquiries, quotations and client conversations together across three businesses.">
  <title>Ironstone · Business overview</title>
  <link rel="icon" href="assets/ironstone.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="scene" aria-hidden="true">
    <img class="scene-poster" src="assets/powermechanics-background.jpg" alt="" fetchpriority="high">
    <video id="background-video" autoplay muted loop playsinline preload="none" poster="assets/powermechanics-background.jpg" data-source="assets/powermechanics-background.mp4"></video>
    <img class="business-scene" id="business-scene" sizes="100vw" alt="">
  </div>

  <div class="shell" id="app">
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="#businesses" aria-label="Ironstone business overview">
          <img src="assets/ironstone.svg" alt="" width="31" height="31">
          <span>Ironstone</span>
        </a>
        <nav class="topnav" aria-label="Main navigation">
          <a href="#businesses" data-nav="businesses">Business overview</a>
          <a href="#demo" data-nav="demo">How it works</a>
        </nav>
        <div class="mast-actions">
          <details class="mast-menu">
            <summary class="mast-icon" aria-label="Notifications" title="Notifications">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21a2 2 0 0 0 4 0"/></svg>
              <span id="notification-dot" hidden></span>
            </summary>
            <div class="mast-popover">
              <h2>Notifications</h2>
              <ul id="notification-list"></ul>
            </div>
          </details>
          <details class="mast-menu">
            <summary class="mast-avatar" aria-label="Profile" title="Profile">AM</summary>
            <div class="mast-popover">
              <h2>Alex Morgan</h2>
              <p>Ironstone demo profile</p>
              <button type="button" class="menu-reset" data-reset-demo>Reset demo data</button>
            </div>
          </details>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <footer class="site-footer">
      <span>Ironstone <span aria-hidden="true">/</span> Interactive demo</span>
      <button type="button" data-reset-demo>Reset demo data</button>
    </footer>
  </div>

  <dialog class="reset-dialog" id="reset-dialog" aria-labelledby="reset-title">
    <form method="dialog">
      <h2 id="reset-title">Reset demo data?</h2>
      <p>Restore the original records for all three businesses and clear your guided demo progress.</p>
      <div class="reset-actions">
        <button type="submit" value="cancel" class="soft-button" autofocus>Cancel</button>
        <button type="submit" value="reset" class="gold-button">Reset demo data</button>
      </div>
    </form>
  </dialog>
  <div class="shell-toast" id="shell-toast" role="status"></div>
</body>
</html>
