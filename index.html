<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#222522">
  <meta name="description" content="PowerMechanics generator service management demo">
  <title>Generator servicing · PowerMechanics</title>
  <link rel="icon" href="assets/powermechanics.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 500; font-display: swap; }

    :root {
      color-scheme: light;
      --ink: #2e2d2a;
      --muted: #625d53;
      --cream: rgba(244, 240, 233, .94);
      --paper: #f4f0e9;
      --inset: #eae6de;
      --line: #d8d1c5;
      --amber: #f6b733;
      --amber-light: #fbd06a;
      --dark: #222522;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      font: 400 16px/1.45 "Inter Tight", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid #9b6710;
      outline-offset: 3px;
    }
    button, a { touch-action: manipulation; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }
    .icon { flex: none; width: 18px; height: 18px; vertical-align: middle; }
    .mono, .eyebrow { font: 500 11px/1.35 var(--mono); letter-spacing: .06em; }
    .eyebrow { text-transform: uppercase; }
    .mono.prefix { letter-spacing: 0; }
    .muted { color: var(--muted); }
    .skip-link {
      position: fixed; z-index: 20; left: 12px; top: 12px; padding: 10px 14px;
      border-radius: 6px; background: var(--amber); transform: translateY(-160%);
    }
    .skip-link:focus { transform: none; }

    .app { position: relative; isolation: isolate; min-height: 100svh; }
    .scene { position: absolute; inset: 0; z-index: -2; background: #383a34; overflow: hidden; }
    .scene img, .scene video { position: absolute; width: 100%; height: 100%; inset: 0; object-fit: cover; object-position: 57% 50%; }
    .scene video { opacity: 0; transition: opacity .8s ease; }
    .scene video.ready { opacity: 1; }
    .scene::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, #10120fd4, #10120f19 37%, transparent 64%, #11130faf 100%),
                  linear-gradient(100deg, #14161162 0%, transparent 63%);
    }
    .app:not(.home) .scene { display: none; }

    .mast {
      display: flex; gap: 12px; align-items: center; position: relative;
      z-index: 5; color: #fffaf0;
    }
    .home .mast { position: absolute; left: 15px; right: calc(21.4% + 21px); top: 14px; }
    .brand {
      display: grid; place-items: center; flex: 0 0 41px; width: 41px; height: 38px;
      border-radius: 8px; background: var(--amber); color: #24241d;
    }
    .brand img { display: block; width: 29px; height: 27px; }
    .user-pill, .topnav {
      border: 1px solid #f5ecc34a; background: #272922c9; backdrop-filter: blur(14px);
      border-radius: 8px;
    }
    .user-pill { display: flex; gap: 9px; align-items: center; height: 38px; padding: 0 12px; white-space: nowrap; }
    .user-pill i, .live-dot {
      display: inline-block; flex: none; width: 7px; height: 7px; background: var(--amber);
      border-radius: 50%; box-shadow: 0 0 0 3px #f6b73326;
    }
    .topnav { display: flex; gap: 2px; margin-left: auto; padding: 3px; min-width: 0; }
    .topnav a { display: grid; place-items: center; min-height: 30px; padding: 3px 10px; white-space: nowrap; font-size: 13px; border-radius: 5px; transition: background .16s; }
    .topnav a:hover { background: #fff5d721; }
    .topnav a[aria-current="page"] { background: #f6eddb; color: #292920; }
    .mast a:focus-visible, .on-image:focus-visible { outline-color: var(--amber-light); }

    .overview {
      display: grid; grid-template-columns: minmax(0, 1.066fr) minmax(0, 1fr) minmax(0, 1.152fr) minmax(0, .902fr);
      grid-template-rows: clamp(265px, calc(57.5svh - 137.5px), 380px)
        clamp(0px, calc(33.33svh - 250px), 50px)
        clamp(110px, calc(15svh + 5px), 140px) clamp(185px, calc(15svh + 80px), 215px);
      align-content: start; gap: 10px; min-height: calc(100svh - 44px); padding: 12px 12px 16px 15px;
    }
    .hero { grid-area: 1 / 1 / 3 / 4; padding-top: 57px; min-width: 0; color: #fffaf0; }
    .breadcrumb { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; }
    .breadcrumb a { text-decoration: underline; text-underline-offset: 3px; }
    .breadcrumb .icon { width: 12px; height: 12px; opacity: .8; }
    .hero .breadcrumb { color: #f6eddb; text-shadow: 0 1px 5px #151610; }
    .hero h1 {
      font-size: clamp(58px, 6.55vw, 98px); font-weight: 300; line-height: .98;
      letter-spacing: -.058em; margin: 4px 0 17px 3px; text-shadow: 0 2px 15px #1c1e1454;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 10px;
      border: 1px solid #f5e1c3; border-radius: 6px; background: #eee1cc; color: #342c22;
      font-size: 12px; transition: background .16s, transform .16s;
    }
    .chip:hover { background: #f8e8ca; transform: translateY(-1px); }
    .chip b { font: 500 12px/1 var(--mono); }
    .status-dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: #61805e; }
    .status-dot.overdue { background: #b04d36; }
    .status-dot.soon { background: #b87c16; }

    .glass {
      min-width: 0; padding: 14px; border-radius: 10px; background: var(--cream);
      border: 1px solid #f8f0e1d9; backdrop-filter: blur(14px);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 19px; }
    .card-head .icon { width: 16px; height: 16px; color: #6f6759; }
    .search-card { grid-area: 3 / 1 / 4 / 2; position: relative; z-index: 3; padding: 11px 14px; }
    .search-card h2 { font-size: 24px; line-height: 1.12; font-weight: 400; letter-spacing: -.04em; }
    .search-card p { font-size: 13px; margin: 4px 0 10px; }
    .search-field { position: relative; display: block; }
    .search-field .icon { position: absolute; top: 50%; left: 11px; transform: translateY(-50%); pointer-events: none; color: #625a4e; }
    .search-field input, .form-field input, .form-field textarea {
      border: 1px solid #cbc2b3; border-radius: 6px; background: #fcf9f2;
      width: 100%; min-width: 0; min-height: 42px; padding: 8px 11px;
      transition: border-color .15s, background .15s;
    }
    .search-field input { padding-left: 37px; font-size: 14px; }
    .search-field input:focus, .form-field input:focus, .form-field textarea:focus { border-color: #957030; background: #fffdf7; }
    .search-results {
      position: absolute; inset: calc(100% - 2px) -1px auto; z-index: 6; background: #faf6ee;
      border: 1px solid #d8cbb7; border-radius: 8px; padding: 5px; max-height: 250px; overflow: auto;
      box-shadow: 0 5px 16px #24221d25;
    }
    .search-results a { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px; border-radius: 5px; font-size: 14px; }
    .search-results a:hover, .search-results a:focus-visible { background: var(--inset); }
    .search-results small { display: block; font-size: 12px; color: var(--muted); }
    .search-results p { padding: 4px 7px; }
    .upcoming { grid-area: 4 / 1 / 5 / 2; }
    .text-link { display: inline-flex; align-items: center; justify-content: center; gap: 4px; line-height: 1.13; font-weight: 600; }
    .text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .text-link .icon { width: 14px; height: 14px; }
    .upcoming .text-link { font-size: 12px; min-height: 22px; }
    .upcoming ol { display: grid; gap: 4px; margin-top: 8px; }
    .upcoming-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 7px;
      min-height: 47px; padding: 5px 8px; border: 1px solid transparent;
      background: var(--inset); border-radius: 6px; line-height: 1.15;
      transition: border-color .15s, background .15s;
    }
    .upcoming-row:hover { border-color: #bdab8a; background: #f6ebd6; }
    .upcoming-row small { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .upcoming-row time { grid-column: 2; grid-row: 1; justify-self: end; }
    .upcoming-row .status { grid-column: 2; grid-row: 2; justify-self: end; }
    .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #3f6240; white-space: nowrap; }
    .status.overdue { color: #913b2a; }
    .status.soon { color: #795309; }
    .status .status-dot { width: 6px; height: 6px; }

    .recent {
      grid-area: 4 / 2 / 5 / 3; display: flex; flex-direction: column; justify-content: space-between;
      min-width: 0; overflow: hidden; position: relative; isolation: isolate; padding: 14px;
      border-radius: 10px; border: 1px solid #f7ead87a; color: #fffaf0; background: #38382e;
    }
    .recent img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: center 52%; }
    .recent::before { content: ""; z-index: -1; position: absolute; inset: 0; background: linear-gradient(180deg, #181914b0, transparent 36%, #16171361 48%, #161713ed 93%); }
    .recent .card-head .icon { color: #fff4d9; }
    .recent .recent-caption { display: grid; gap: 2px; min-width: 0; }
    .recent h3 { font-size: clamp(21px, 2vw, 28px); font-weight: 400; line-height: 1.08; letter-spacing: -.035em; }
    .recent time, .recent p { color: #f7edda; font-size: 12px; }
    .recent p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .recent .text-link { justify-self: start; min-height: 29px; margin-top: 4px; padding: 3px 8px; border-radius: 5px; border: 1px solid #fff1d77d; background: #2d2b22b0; font-size: 12px; }

    .chart-card { grid-area: 4 / 3 / 5 / 4; }
    .chart-controls { display: flex; gap: 4px; margin-top: 8px; }
    .chart-controls button {
      flex: 1; min-width: 0; padding: 5px 3px; min-height: 27px; white-space: nowrap;
      border: 1px solid transparent; border-radius: 4px; background: var(--inset);
      font: 500 9px/1.2 var(--mono); transition: background .16s, border-color .16s;
    }
    .chart-controls button:hover { border-color: #b7aa94; }
    .chart-controls button[aria-pressed="true"] { background: #f8de9f; border-color: #eecb77; }
    .chart { margin-top: 5px; }
    .chart svg { width: 100%; height: 82px; display: block; overflow: visible; }
    .chart text { font: 500 9px var(--mono); fill: #5e574a; }
    .chart-labels { position: relative; height: 16px; color: var(--muted); font: 500 9px/1.2 var(--mono); }
    .chart-labels span { position: absolute; left: var(--position); transform: translateX(-50%); white-space: nowrap; }
    .chart .gridline { stroke: #d5cdbd; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .chart .chart-line { stroke: #9a6920; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .chart .chart-dot { fill: var(--amber); stroke: #77501a; stroke-width: 1; }
    .chart figcaption { font-size: 11px; color: var(--muted); }

    .health { grid-area: 1 / 4 / 2 / 5; display: flex; flex-direction: column; }
    .health .card-head { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .health .card-head .icon { color: #786442; }
    .gauge { flex: 1; display: grid; place-content: center; min-height: 0; text-align: center; }
    .gauge-dial { position: relative; width: min(100%, 280px); margin: 0 auto; }
    .gauge-dial svg { display: block; width: 100%; height: auto; }
    .gauge-text { position: absolute; inset: 38% 0 auto; }
    .gauge-text strong { display: block; font-size: clamp(49px, 5.45vw, 79px); line-height: 1; font-weight: 300; letter-spacing: -.08em; font-variant-numeric: tabular-nums; }
    .gauge-text strong small { font-size: .54em; letter-spacing: -.06em; }
    .gauge-text p { font-size: 14px; margin-top: 3px; }
    .gauge-scale { display: flex; justify-content: space-between; padding: 0 11%; color: var(--muted); font-size: 10px; }
    .health-indicators { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 11px; }
    .health-indicators div { background: var(--inset); border-radius: 6px; padding: 9px 8px; }
    .health-indicators .eyebrow { display: flex; align-items: center; gap: 6px; font-size: 9px; }
    .health-indicators strong { font-weight: 400; display: block; font-size: 26px; letter-spacing: -.05em; line-height: 1.08; margin-top: 5px; }
    .summary { grid-area: 2 / 4 / 5 / 5; display: flex; flex-direction: column; }
    .summary-items { flex: 1; display: grid; grid-template-rows: repeat(3, 1fr); gap: 7px; margin-top: 11px; }
    .metric {
      display: grid; grid-template: auto auto / 1fr auto; align-content: center; align-items: center;
      gap: 2px 7px; min-width: 0; min-height: 75px; padding: 8px 12px;
      background: var(--inset); border: 1px solid #dfd8cb; border-radius: 7px;
      transition: background .16s, border-color .16s;
    }
    .metric:hover { background: #f7ead2; border-color: #cbb88f; }
    .metric .value { font-size: clamp(37px, 4vw, 57px); font-weight: 300; line-height: .98; letter-spacing: -.07em; font-variant-numeric: tabular-nums; }
    .metric .eyebrow { color: #524b3d; }
    .tile { display: grid; flex: none; place-items: center; place-self: center end; grid-area: 1 / 2 / 3; width: 39px; height: 39px; border: 1px solid #e7cb96; border-radius: 7px; background: #f4dfb7; color: #694b1b; }
    .tile .icon { width: 19px; height: 19px; }

    .footer { display: flex; align-items: center; gap: 8px 15px; flex-wrap: wrap; justify-content: space-between; min-height: 44px; padding: 7px 15px; color: var(--muted); font-size: 12px; }
    .home .footer { color: #fff6e6; background: #1617139e; border-top: 1px solid #ffffff2b; }
    .wordmark { font-size: 13px; font-weight: 600; letter-spacing: .015em; }
    .footer button { min-height: 29px; border: 0; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
    .home .footer button:focus-visible { outline-color: var(--amber-light); }

    .app:not(.home) { background: #f1ede5; }
    .app:not(.home) .mast { background: var(--dark); padding: 12px clamp(15px, 4vw, 58px); }
    .app:not(.home) .footer { max-width: 1240px; margin: auto; padding-inline: clamp(15px, 4vw, 40px); border-top: 1px solid var(--line); }
    .operational { max-width: 1240px; padding: 30px clamp(15px, 4vw, 40px) 52px; margin: 0 auto; min-height: calc(100svh - 108px); }
    .page-head { margin-bottom: 24px; }
    .page-head h1, .detail-title { font-size: clamp(42px, 6vw, 72px); font-weight: 300; line-height: 1; letter-spacing: -.055em; margin: 10px 0 8px; overflow-wrap: anywhere; }
    .page-head p { color: var(--muted); max-width: 55ch; }
    .page-head .breadcrumb { margin-bottom: 13px; }
    .panel { border: 1px solid #d9d0c1; background: #faf6ee; border-radius: 10px; padding: 17px; min-width: 0; }
    .panel h2 { font-size: 24px; line-height: 1.1; font-weight: 400; letter-spacing: -.035em; }
    .stack { display: grid; gap: 10px; }
    .client-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .client-card { display: grid; grid-template-columns: 45px minmax(0, 1fr) auto; align-items: center; gap: 7px 12px; min-height: 109px; }
    .client-card .tile { grid-area: auto; justify-self: start; }
    .client-card h2 { margin-bottom: 3px; }
    .client-card .meta { grid-column: 2 / 4; color: var(--muted); }
    .record-card { display: grid; grid-template-columns: 1.1fr 1fr auto 20px; gap: 9px 18px; align-items: center; }
    .record-card .unit { font-size: 21px; font-weight: 500; letter-spacing: -.03em; line-height: 1.15; }
    .record-card p, .client-card p { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .record-card .detail-date { text-align: right; }
    .record-card .detail-date time { display: block; font-size: 15px; }
    .record-card .detail-date .status { margin-top: 4px; }
    .record-card .row-icon, .client-card .row-icon { color: #796748; }
    .record-card:hover, .client-card:hover, .timeline a:hover { border-color: #b5a17c; background: #fff8e8; }
    .record-card, .client-card, .timeline a { transition: border .16s, background .16s; }
    .group { scroll-margin-top: 12px; }
    .group .group-head { display: flex; align-items: center; gap: 7px; font-size: 19px; font-weight: 500; margin: 20px 0 8px; }
    .group:first-child .group-head { margin-top: 0; }
    .group .count { font-size: 10px; background: var(--inset); border-radius: 4px; padding: 3px 5px; }
    .group .empty { color: var(--muted); padding: 12px; border: 1px dashed #d1c7b6; border-radius: 7px; }
    .group:target .group-head { color: #845714; }

    .detail-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: clamp(15px, 3vw, 28px); }
    .detail-header .detail-title { margin-top: 2px; }
    .detail-header .model { font-size: 21px; margin-bottom: 4px; }
    .detail-header .status { margin-top: 9px; padding: 5px 9px; background: var(--inset); border-radius: 5px; }
    .detail-header .detail-facts { grid-column: 1 / -1; }
    .detail-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 7px; }
    .detail-facts div { padding: 9px; border: 1px solid #e1d9c9; border-radius: 6px; background: var(--inset); min-width: 0; }
    .detail-facts dt { color: var(--muted); margin-bottom: 3px; }
    .detail-facts dd { overflow-wrap: anywhere; }
    .service-work { margin-top: 17px; }
    .service-work p { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 7px; }
    .history { margin-top: 22px; }
    .history h2 { font-size: 26px; font-weight: 400; letter-spacing: -.035em; margin-bottom: 9px; }
    .timeline { padding-left: 16px; }
    .timeline li { position: relative; padding: 0 0 8px 13px; border-left: 1px solid #c2ab7b; }
    .timeline li::before {
      content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%;
      background: var(--amber); border: 2px solid #f2ece1; left: -5.5px; top: 18px; box-shadow: 0 0 0 1px #b79353;
    }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline a { display: grid; gap: 4px; padding: 12px; }
    .timeline a header { display: flex; gap: 7px; justify-content: space-between; align-items: center; }
    .timeline a p { overflow-wrap: anywhere; }
    .timeline a small { color: var(--muted); }
    .log-search { max-width: 400px; margin: 0 0 12px; }
    .log-entry { grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1.5fr) auto 18px; }
    .log-entry .work-preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); }
    .log-entry .detail-date small { display: block; white-space: nowrap; }
    .button {
      display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 42px; padding: 8px 13px;
      font-weight: 600; white-space: nowrap; border: 1px solid #c4b8a5; border-radius: 6px;
      background: #f5eee0; transition: background .16s, transform .16s;
    }
    .button:hover { background: #ede2cf; }
    .button:active { transform: scale(.98); }
    .button.primary { background: var(--amber); border-color: #c58c21; color: #2a2419; }
    .button.primary:hover { background: var(--amber-light); }

    dialog { width: min(520px, calc(100% - 26px)); max-height: calc(100% - 26px); margin: auto; padding: 17px; border: 1px solid #d4c9b7; border-radius: 10px; background: #faf6ee; color: var(--ink); }
    dialog::backdrop { background: #1a1b16a1; backdrop-filter: blur(4px); }
    dialog h2 { font-size: 31px; font-weight: 400; line-height: 1; letter-spacing: -.04em; margin: 3px 0 6px; }
    dialog p { color: var(--muted); }
    .dialog-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .form-field { display: grid; gap: 4px; font-size: 14px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field textarea { resize: vertical; min-height: 88px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 7px; flex-wrap: wrap; margin-top: 13px; }
    .form-error { margin-top: 9px; color: #983a2d; font-size: 14px; }
    .toast {
      position: fixed; z-index: 9; right: 15px; bottom: 15px; display: flex; align-items: center; gap: 7px;
      max-width: calc(100% - 30px); padding: 9px 12px; color: #fffaf0; background: #262a21;
      border: 1px solid #78694c; border-radius: 7px;
    }
    .toast .icon { color: var(--amber-light); }

    @keyframes enter-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="app home" id="app">
    <div class="scene" aria-hidden="true">
      <img src="assets/powermechanics-background.jpg" alt="" fetchpriority="high">
      <video id="background-video" autoplay muted loop playsinline preload="none" poster="assets/powermechanics-background.jpg" data-source="assets/powermechanics-background.mp4"></video>
    </div>
    <header class="mast">
      <a class="brand" href="#overview" aria-label="PowerMechanics overview"><img src="assets/powermechanics.svg" width="29" height="27" alt=""></a>
      <span class="user-pill mono"><span class="prefix">::</span> Alex Reed <i aria-hidden="true"></i></span>
      <nav class="topnav" aria-label="Service management">
        <a href="#overview" data-nav="overview">Overview</a>
        <a href="#clients" data-nav="clients">Clients &amp; generators</a>
        <a href="#log" data-nav="log">Service log</a>
        <a href="#schedule" data-nav="schedule">Service schedule</a>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer">
      <span class="wordmark">PowerMechanics</span>
      <p>Example demo — we can build on this around how your team works.</p>
      <button type="button" data-action="reset">Reset demo data</button>
    </footer>
  </div>

  <dialog id="service-dialog" aria-labelledby="service-form-title">
    <form id="service-form">
      <h2 id="service-form-title">Record service</h2>
      <p id="service-form-unit"></p>
      <div class="dialog-fields">
        <label class="form-field">Service date <input type="date" name="serviceDate" required></label>
        <label class="form-field">Technician <input type="text" name="technician" required maxlength="80" autocomplete="off"></label>
        <label class="form-field full">Work completed <textarea name="work" required maxlength="1600" rows="3"></textarea></label>
        <label class="form-field full">Next service date <input type="date" name="nextDate" required></label>
      </div>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="button" data-action="close-dialog">Cancel</button>

  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <form id="reset-form">
      <h2 id="reset-title">Reset demo data?</h2>
      <p>This restores the original fictional records and removes services saved in this browser.</p>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="button" data-action="close-dialog" autofocus>Cancel</button>
        <button type="submit" class="button primary">Reset demo data</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="panel">Enable JavaScript to open the PowerMechanics service demo.</p></noscript>

  <script>
    "use strict";

    const technician = "Alex Reed";
    const storageKey = "powermechanics.services.v1";
    const motion = matchMedia("(prefers-reduced-motion: reduce)");
    const app = document.querySelector("#app");
    const main = document.querySelector("#main");
    const video = document.querySelector("#background-video");
    const serviceDialog = document.querySelector("#service-dialog");
    const serviceForm = document.querySelector("#service-form");
    const resetDialog = document.querySelector("#reset-dialog");
    const toast = document.querySelector("#toast");

    const clientList = [
      { id: "karoo", name: "Karoo Cold Storage", location: "Montague Gardens, Cape Town" },
      { id: "northline", name: "Northline Logistics", location: "Epping, Cape Town" },
      { id: "westhaven", name: "Westhaven Medical Centre", location: "Milnerton, Cape Town" },
      { id: "fynbos", name: "Fynbos Business Park", location: "Airport Industria, Cape Town" }
    ];
    const clientById = new Map(clientList.map(client => [client.id, client]));
    const states = {
      overdue: { label: "Overdue", heading: "Overdue" },
      soon: { label: "Due soon", heading: "Due soon" },
      later: { label: "Up to date", heading: "Later" }
    };
    const frames = {
      week: "This week",
      month: "This month",
      next: "Next month"
    };
    const icons = {
      arrow: '<path d="M4 12h15m-6-6 6 6-6 6"/>',
      chevron: '<path d="m9 5 7 7-7 7"/>',
      search: '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/>',
      clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
      calendar: '<rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.5v4m8-4v4M4 10h16m-11 4h2m2 0h2m-6 3h2"/>',
      pulse: '<path d="M2.5 12h4l3-6.5 4.5 13 3.5-6.5h4"/>',
      unit: '<rect x="3" y="5" width="18" height="13" rx="1.6"/><path d="M7 18v2m10-2v2M7 9v5m3-5v5m3 0h4m0-5v1"/>',
      tools: '<path d="M15.7 4.1a5 5 0 0 0-5.8 6.4L4.8 16a2.3 2.3 0 0 0 3.2 3.2l5.6-5.5a5 5 0 0 0 6.3-5.9l-3.4 3.1-3-3z"/>',
      building: '<path d="M3 20h18M5 20V8l7-4v16m0-10h7v10M8 10v1m0 3v1m7-2h1m-1 3h1"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      plus: '<path d="M12 5v14M5 12h14"/>'
    };
    const dayLength = 86400000;
    const dateShort = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
    const dateLong = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
    const weekday = new Intl.DateTimeFormat("en-GB", { weekday: "short", timeZone: "UTC" });
    const safeCharacters = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

    let data = readData() ?? seedData();
    let selectedFrame = "month";
    let logFilter = "";
    let formGenerator = "";
    let toastTimeout;
    let openingTimeout;
    let firstRender = true;

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, character => safeCharacters[character]);
    }

    function icon(name, className = "") {
      return `<svg class="icon ${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
    }

    function utcDay(year, month, date) {
      const value = new Date(0);
      value.setUTCFullYear(year, month, date);
      return value.getTime() / dayLength;
    }

    function today() {
      const now = new Date();
      return utcDay(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function iso(day) {
      return new Date(day * dayLength).toISOString().split("T")[0];
    }

    function dateNumber(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return NaN;
      const [year, month, day] = value.split("-").map(Number);
      const serial = utcDay(year, month - 1, day);
      return iso(serial) === value ? serial : NaN;
    }

    function monthStart(now, offset = 0) {
      const date = new Date(now * dayLength);
      return utcDay(date.getUTCFullYear(), date.getUTCMonth() + offset, 1);
    }

    function weekStart(day) {
      const weekdayIndex = new Date(day * dayLength).getUTCDay();
      return day - (weekdayIndex + 6) % 7;
    }

    function time(date, compact = false) {
      const label = (compact ? dateShort : dateLong).format(dateNumber(date) * dayLength);
      return `<time datetime="${date}">${label}</time>`;
    }

    function seedData() {
      const now = today();
      const units = [
        ["PM-104", "Cummins C275 D5", "karoo", "Cold store A", -104, -9, "Changed engine oil and fuel filters. Verified automatic transfer under load."],
        ["PM-106", "FG Wilson P200-3", "karoo", "Loading bays", -95, 0, "Cleaned radiator fins, tested starter batteries and checked coolant concentration."],
        ["PM-109", "Perkins 1506A-E88TAG", "karoo", "Cold store B", -52, 35, "Inspected belts and hoses, replaced the air filter and completed a loaded run."],
        ["PM-202", "Volvo Penta TAD1344GE", "northline", "Distribution warehouse", -101, -3, "Replaced the primary fuel filter and checked for leaks after a load-bank test."],
        ["PM-205", "Cummins C150 D5", "northline", "Dispatch office", -62, 24, "Serviced the battery charger, checked fluids and recorded transfer-switch timing."],
        ["PM-307", "FG Wilson P110-3", "westhaven", "Plant room", -82, 8, "Replaced oil and filters, inspected the exhaust and tested mains-failure transfer."],
        ["PM-310", "Kohler KD220", "westhaven", "Day clinic", -5, 52, "Replaced fuel filters and completed a 45-minute load test."],
        ["PM-408", "Perkins 1106A-70TAG2", "fynbos", "Building C", -72, 16, "Checked fuel lines, adjusted belt tension and tested the emergency stop."]
      ];
      return units.map(([ref, model, clientId, location, serviced, due, work], index) => ({
        ref, model, clientId, location,
        records: [
          { id: `${ref}-2`, serviceDate: iso(now + serviced), nextDate: iso(now + due), technician: index % 2 ? "Maya Jacobs" : technician, work },
          {
            id: `${ref}-1`, serviceDate: iso(now + serviced - 92), nextDate: iso(now + serviced),
            technician: index % 2 ? technician : "Maya Jacobs",
            work: index % 2 ? "Inspected electrical connections and fuel supply, then ran the unit under load." :
              "Completed the scheduled inspection, checked fluids and logged battery voltage."
          }
        ]
      }));
    }

    function readData() {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(stored) && stored.length && stored.every(unit => unit.records?.length && clientById.has(unit.clientId))) {
          return stored;
        }
      } catch {
        // The sample fleet can still be explored when storage is unavailable.
      }
      return null;
    }

    function saveData(nextData) {
      localStorage.setItem(storageKey, JSON.stringify(nextData));
      data = nextData;
    }

    function newestFirst(a, b) {
      return b.serviceDate.localeCompare(a.serviceDate);
    }

    function orderedHistory(unit) {
      return [...unit.records].sort(newestFirst);
    }

    function getFleet(now = today()) {
      return data.map(unit => {
        const latest = orderedHistory(unit)[0];
        const due = dateNumber(latest.nextDate);
        const status = due < now ? "overdue" : due <= now + 14 ? "soon" : "later";
        return { ...unit, latest, due, status, client: clientById.get(unit.clientId) };
      });
    }

    function serviceEntries(fleet) {
      return fleet.flatMap(unit => unit.records.map(record => ({ unit, ...record }))).sort(newestFirst);
    }

    function unitLink(unit) {
      return `#generators/${encodeURIComponent(unit.ref)}`;
    }

    function serviceLink(unit, record) {
      return `#services/${encodeURIComponent(unit.ref)}/${encodeURIComponent(record.id)}`;
    }

    function stateLabel(status) {
      return `<span class="status ${status}"><i aria-hidden="true" class="status-dot ${status}"></i>${states[status].label}</span>`;
    }

    function cardHead(label, symbol, extra = "") {
      return `<div class="card-head"><h2 class="eyebrow">::${label}</h2>${extra || icon(symbol)}</div>`;
    }

    function breadcrumb(items) {
      return `<nav class="breadcrumb" aria-label="Breadcrumb">${items.map(([label, href], index) => `
        ${index ? icon("chevron") : ""}${href ? `<a href="${href}">${escapeHtml(label)}</a>` : `<span ${index === items.length - 1 ? 'aria-current="page"' : ""}>${escapeHtml(label)}</span>`}
      `).join("")}</nav>`;
    }

    function searchField(id, label, placeholder, extra = "") {
      return `<label class="search-field" for="${id}"><span class="sr-only">${label}</span>${icon("search")}
        <input type="search" id="${id}" placeholder="${placeholder}" autocomplete="off" ${extra}>
      </label>`;
    }

    function overview(fleet, now) {
      const inOrder = [...fleet].sort((a, b) => a.due - b.due);
      const overdue = fleet.filter(unit => unit.status === "overdue").length;
      const soon = fleet.filter(unit => unit.status === "soon").length;
      const onTrack = fleet.length - overdue - soon;
      const dueMonth = fleet.filter(unit => unit.due >= now && unit.due < monthStart(now, 1)).length;
      const recent = serviceEntries(fleet)[0];
      const percent = fleet.length ? Math.round(onTrack * 100 / fleet.length) : 0;
      const action = `<a href="#schedule" class="text-link" aria-label="Full schedule"><span>Full schedule</span>${icon("arrow")}</a>`;

      return `<div class="overview">
        <section class="hero" aria-labelledby="overview-title">
          ${breadcrumb([["Service management"], ["Overview"]])}
          <h1 id="overview-title">Generator servicing</h1>
          <div class="chips">
            <a class="chip" href="#schedule/overdue"><i class="status-dot overdue" aria-hidden="true"></i><b data-count="${overdue}">${overdue}</b> Overdue</a>
            <a class="chip" href="#schedule/soon"><i class="status-dot soon" aria-hidden="true"></i><b data-count="${soon}">${soon}</b> Due soon</a>
          </div>
        </section>

        <section class="glass search-card" aria-labelledby="search-title">
          <h2 id="search-title">Find a generator</h2>
          <p class="muted">Search clients, locations or unit references</p>
          ${searchField("generator-search", "Find a generator", "Client, unit, model or location", 'aria-controls="generator-results"')}
          <p class="sr-only" id="search-announcement" role="status"></p>
          <div id="generator-results" class="search-results" hidden></div>
        </section>

        <section class="glass upcoming">
          ${cardHead("Upcoming services", "", action)}
          <ol>${inOrder.slice(0, 3).map(unit => `<li>
            <a class="upcoming-row" href="${unitLink(unit)}">
              <strong class="mono">${escapeHtml(unit.ref)}</strong>
              ${time(unit.latest.nextDate, true)}
              <small>${escapeHtml(unit.client.name)}</small>
              ${stateLabel(unit.status)}
            </a>
          </li>`).join("")}</ol>
        </section>

        <section class="recent">
          <img src="assets/recent-service.jpg" alt="" width="840" height="560">
          ${cardHead("Recent work", "tools")}
          <div class="recent-caption">
            <h3>${escapeHtml(recent.unit.ref)} <span aria-hidden="true">·</span> ${escapeHtml(recent.unit.client.name)}</h3>
            ${time(recent.serviceDate)}
            <p>${escapeHtml(recent.work)}</p>
            <a class="text-link on-image" href="${serviceLink(recent.unit, recent)}">View service ${icon("arrow")}</a>
          </div>
        </section>

        <section class="glass chart-card">
          ${cardHead("Service schedule", "calendar")}
          <div class="chart-controls" role="group" aria-label="Schedule timeframe">
            ${Object.entries(frames).map(([key, name]) => `<button type="button" data-frame="${key}" aria-pressed="${selectedFrame === key}">${name.toUpperCase()}</button>`).join("")}
          </div>
          <figure class="chart" id="schedule-chart" aria-live="polite">${chart(fleet, now)}</figure>
        </section>

        <section class="glass health">
          ${cardHead("Service health", "pulse")}
          ${gauge(percent)}
          <div class="health-indicators">
            <div><span class="eyebrow"><i class="status-dot" aria-hidden="true"></i>Up to date</span><strong data-count="${onTrack}">${onTrack}</strong></div>
            <div><span class="eyebrow"><i class="status-dot soon" aria-hidden="true"></i>Needs attention</span><strong data-count="${overdue + soon}">${overdue + soon}</strong></div>
          </div>
        </section>

        <section class="glass summary">
          ${cardHead("Service summary", "unit")}
          <div class="summary-items">
            ${metric(overdue, "Overdue", "clock", "#schedule/overdue")}
            ${metric(dueMonth, "Due this month", "calendar", "#schedule/month")}
            ${metric(fleet.length, "Active generators", "unit", "#clients")}
          </div>
        </section>
      </div>`;
    }

    function metric(count, label, symbol, href) {
      return `<a class="metric" href="${href}">
        <strong class="value" data-count="${count}">${count}</strong>
        <span class="eyebrow">${label}</span>
        <span class="tile">${icon(symbol)}</span>
      </a>`;
    }

    function gauge(percent) {
      return `<div class="gauge">
        <div class="gauge-dial">
          <svg viewBox="0 0 280 160" aria-hidden="true">
            <defs><linearGradient id="gauge-colors"><stop stop-color="#f9e8b9"/><stop offset=".56" stop-color="#f8cb60"/><stop offset="1" stop-color="#e8a329"/></linearGradient></defs>
            <path d="M28 137 A112 112 0 0 1 252 137" fill="none" stroke="url(#gauge-colors)" stroke-width="21" stroke-linecap="round"/>
            <path d="M47 137 A93 93 0 0 1 233 137" fill="none" stroke="#d6cbb6" stroke-width="2"/>
            <path class="gauge-progress" d="M47 137 A93 93 0 0 1 233 137" fill="none" stroke="#805b20" stroke-width="2.5" stroke-linecap="round"
              pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - percent}" style="--dash:${100 - percent}"/>
            <circle cx="28" cy="137" r="6" fill="#fffaf2" stroke="#dabe87"/>
            <circle cx="252" cy="137" r="6" fill="#fffaf2" stroke="#dabe87"/>
          </svg>
          <div class="gauge-text"><strong><span data-count="${percent}">${percent}</span><small>%</small></strong><p>Up to date</p></div>
        </div>
        <div class="gauge-scale mono" aria-hidden="true"><span>0%</span><span>100%</span></div>
      </div>`;
    }

    function chart(fleet, now) {
      const next = selectedFrame === "next";
      const daily = selectedFrame === "week";
      const start = daily ? weekStart(now) : monthStart(now, next ? 1 : 0);
      const end = daily ? start + 7 : monthStart(now, next ? 2 : 1);
      const buckets = [];
      for (let day = start; day < end;) {
        const nextDay = Math.min(end, daily ? day + 1 : weekStart(day) + 7);
        const count = fleet.filter(unit => unit.due >= Math.max(now, day) && unit.due < nextDay).length;
        const label = (daily ? weekday : dateShort).format(day * dayLength);
        buckets.push({ label, count });
        day = nextDay;
      }
      const max = Math.max(2, ...buckets.map(bucket => bucket.count));
      const total = buckets.reduce((sum, bucket) => sum + bucket.count, 0);
      const y = count => 74 - count * 62 / max;
      const points = buckets.map((bucket, index) => ({
        ...bucket, x: 23 + index * 275 / (buckets.length - 1), y: y(bucket.count)
      }));
      const line = points.map(point => `${point.x},${point.y}`).join(" ");
      const label = `${frames[selectedFrame]}, ${points.map(point => `${point.label}: ${point.count}`).join(", ")}`;

      return `<svg viewBox="0 0 327 82" preserveAspectRatio="none" role="img" aria-label="${label}">
        <defs><linearGradient id="chart-shade" x2="0" y2="1"><stop stop-color="#e7b455" stop-opacity=".38"/><stop offset="1" stop-color="#e7b455" stop-opacity=".04"/></linearGradient></defs>
        ${[max, Math.floor(max / 2), 0].map(tick => `
          <line class="gridline" x1="19" x2="315" y1="${y(tick)}" y2="${y(tick)}" />
          <text x="8" y="${y(tick) + 3}" text-anchor="middle">${tick}</text>
        `).join("")}
        <polygon points="23,74 ${line} 298,74" fill="url(#chart-shade)"/>
        <polyline class="chart-line" points="${line}" pathLength="100"/>
        ${points.map(point => `
          <circle class="chart-dot" cx="${point.x}" cy="${point.y}" r="3"><title>${point.label} · ${point.count}</title></circle>
        `).join("")}
      </svg>
      <div class="chart-labels" aria-hidden="true">${points.map(point =>
        `<span style="--position: ${point.x / 327 * 100}%">${point.label}</span>`).join("")}</div>
      <figcaption>${total} ${total === 1 ? "service" : "services"} scheduled ${next ? "next month" : "from today"}</figcaption>`;
    }

    function operational(heading, crumbs, contents) {
      return `<div class="operational">
        <header class="page-head">
          ${breadcrumb([["Overview", "#overview"], ...crumbs])}
          ${heading ? `<h1>${escapeHtml(heading)}</h1>` : ""}
        </header>
        ${contents}
      </div>`;
    }

    function clientsPage(fleet) {
      const cards = clientList.map(client => {
        const units = fleet.filter(unit => unit.clientId === client.id);
        const attention = units.filter(unit => unit.status !== "later").length;
        return `<a class="panel client-card" href="#clients/${client.id}">
          <span class="tile">${icon("building")}</span>
          <div><h2>${escapeHtml(client.name)}</h2><p>${escapeHtml(client.location)}</p></div>
          ${icon("chevron", "row-icon")}
          <small class="meta mono">${units.length} ${units.length === 1 ? "generator" : "generators"} · ${attention} need attention</small>
        </a>`;
      });
      return operational("Clients & generators", [["Clients & generators"]], `<div class="client-grid">${cards.join("")}</div>`);
    }

    function generatorCard(unit) {
      return `<a class="panel record-card" href="${unitLink(unit)}">
        <div><span class="unit">${escapeHtml(unit.ref)}</span><p>${escapeHtml(unit.model)}</p></div>
        <div class="record-location"><span>${escapeHtml(unit.client.name)}</span><p>${escapeHtml(unit.location)}</p></div>
        <div class="detail-date"><small class="eyebrow muted">Next service</small>${time(unit.latest.nextDate)}${stateLabel(unit.status)}</div>
        ${icon("chevron", "row-icon")}
      </a>`;
    }

    function clientPage(client, fleet) {
      const cards = fleet.filter(unit => unit.clientId === client.id).map(generatorCard).join("");
      return operational(client.name, [["Clients & generators", "#clients"], [client.name]], `<div class="stack">${cards}</div>`);
    }

    function fact(label, value) {
      return `<div><dt class="eyebrow">${label}</dt><dd>${value}</dd></div>`;
    }

    function generatorPage(unit) {
      const crumbs = [["Clients & generators", "#clients"], [unit.client.name, `#clients/${unit.client.id}`], [unit.ref]];
      const title = `<section class="panel detail-header">
        <div>
          <h1 class="detail-title">${escapeHtml(unit.ref)}</h1>
          <p class="model">${escapeHtml(unit.model)}</p>
          <p class="muted">${escapeHtml(unit.client.name)} · ${escapeHtml(unit.location)}</p>
          ${stateLabel(unit.status)}
        </div>
        <button type="button" class="button primary" data-action="record" data-unit="${escapeHtml(unit.ref)}">${icon("plus")} Record service</button>
        <dl class="detail-facts">
          ${fact("Last service", time(unit.latest.serviceDate))}
          ${fact("Next service due", time(unit.latest.nextDate))}
          ${fact("Last technician", escapeHtml(unit.latest.technician))}
        </dl>
      </section>`;
      const timeline = orderedHistory(unit).map(record => `<li>
        <a class="panel" href="${serviceLink(unit, record)}">
          <header><strong>${time(record.serviceDate)}</strong>${icon("chevron")}</header>
          <p>${escapeHtml(record.work)}</p>
          <small>${escapeHtml(record.technician)} · Next service ${time(record.nextDate)}</small>
        </a>
      </li>`).join("");
      return operational("", crumbs, `${title}
        <section class="history" aria-labelledby="history-title"><h2 id="history-title">Service history</h2><ol class="timeline">${timeline}</ol></section>`);
    }

    function filterMatches(query, ...values) {
      const haystack = values.join(" ").toLocaleLowerCase();
      return query.trim().toLocaleLowerCase().split(/\s+/).every(token => haystack.includes(token));
    }

    function logEntries(fleet) {
      const entries = serviceEntries(fleet).filter(({ unit, technician, work, serviceDate, nextDate }) =>
        filterMatches(logFilter, unit.ref, unit.model, unit.client.name, technician, work, serviceDate, nextDate)
      );
      return entries.map(entry => `<a class="panel record-card log-entry" href="${serviceLink(entry.unit, entry)}">
        <span class="log-date"><small class="eyebrow muted">Serviced</small><br>${time(entry.serviceDate)}</span>
        <div class="log-unit"><span class="unit">${escapeHtml(entry.unit.ref)}</span><p>${escapeHtml(entry.unit.client.name)}</p></div>
        <div class="log-work"><p class="work-preview">${escapeHtml(entry.work)}</p><p>${escapeHtml(entry.technician)}</p></div>
        <div class="detail-date"><small class="eyebrow muted">Next service</small>${time(entry.nextDate)}</div>
        ${icon("chevron", "row-icon")}
      </a>`).join("") || '<p class="panel" role="status">No services match your search.</p>';
    }

    function logPage(fleet) {
      return operational("Service log", [["Service log"]], `
        <div class="log-search">${searchField("log-search", "Search the service log", "Search records", `value="${escapeHtml(logFilter)}"`)}</div>
        <div class="stack" id="log-entries">${logEntries(fleet)}</div>`);
    }

    function servicePage(unit, record) {
      const crumbs = [["Service log", "#log"], [unit.ref, unitLink(unit)], ["Service record"]];
      return operational("Service record", crumbs, `<article class="panel">
        <h2><a class="text-link" href="${unitLink(unit)}">${escapeHtml(unit.ref)} ${icon("arrow")}</a></h2>
        <p class="muted">${escapeHtml(unit.client.name)} · ${escapeHtml(unit.location)}</p>
        <dl class="detail-facts">
          ${fact("Service date", time(record.serviceDate))}
          ${fact("Next service date", time(record.nextDate))}
          ${fact("Technician", escapeHtml(record.technician))}
        </dl>
        <div class="service-work"><h3 class="eyebrow">::Work completed</h3><p>${escapeHtml(record.work)}</p></div>
      </article>`);
    }

    function schedulePage(fleet, now, filter) {
      const byDue = [...fleet].sort((a, b) => a.due - b.due);
      const forMonth = filter === "month";
      const end = monthStart(now, 1);
      const groups = Object.entries(states).map(([key, { heading }]) => {
        const units = byDue.filter(unit => unit.status === key && (!forMonth || (unit.due >= now && unit.due < end)));
        if (forMonth && key === "overdue") return "";
        return `<section class="group" id="group-${key}" aria-labelledby="group-title-${key}">
          <h2 class="group-head" id="group-title-${key}"><i class="status-dot ${key}" aria-hidden="true"></i>${heading} <span class="count mono">${units.length}</span></h2>
          <div class="stack">${units.map(generatorCard).join("") || '<p class="empty">No services in this group.</p>'}</div>
        </section>`;
      }).join("");
      const filters = forMonth ? `<p><a class="button" href="#schedule">Show all dates ${icon("arrow")}</a></p>` : "";
      return operational(forMonth ? "Due this month" : "Service schedule", [
        forMonth ? ["Service schedule", "#schedule"] : ["Service schedule"],
        ...(forMonth ? [["Due this month"]] : [])
      ], `<div class="stack">${filters}<div>${groups}</div></div>`);
    }

    function missingPage() {
      return operational("Record unavailable", [["Record unavailable"]], '<a class="button" href="#clients">Browse clients &amp; generators</a>');
    }

    function currentRoute() {
      try {
        return (location.hash.slice(1) || "overview").split("/").map(decodeURIComponent);
      } catch {
        return ["missing"];
      }
    }

    function render({ focus = false } = {}) {
      const [section, ref, recordId] = currentRoute();
      const now = today();
      const fleet = getFleet(now);
      const unit = fleet.find(item => item.ref === ref);
      const client = clientById.get(ref);
      const record = unit?.records.find(item => item.id === recordId);
      const onOverview = section === "overview";
      const heading = {
        overview: "Generator servicing", clients: client?.name || "Clients & generators",
        generators: unit?.ref, services: "Service record", log: "Service log",
        schedule: ref === "month" ? "Due this month" : "Service schedule"
      }[section];
      const navSection = { generators: "clients", services: "log" }[section] || section;

      app.classList.toggle("home", onOverview);
      document.title = `${heading || "Record unavailable"} · PowerMechanics`;
      document.querySelectorAll("[data-nav]").forEach(link => {
        if (link.dataset.nav === navSection) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });

      switch (section) {
        case "overview": main.innerHTML = overview(fleet, now); break;
        case "clients": main.innerHTML = ref ? (client ? clientPage(client, fleet) : missingPage()) : clientsPage(fleet); break;
        case "generators": main.innerHTML = unit ? generatorPage(unit) : missingPage(); break;
        case "services": main.innerHTML = record ? servicePage(unit, record) : missingPage(); break;
        case "log": main.innerHTML = logPage(fleet); break;
        case "schedule": main.innerHTML = schedulePage(fleet, now, ref); break;
        default: main.innerHTML = missingPage();
      }

      if (focus) {
        window.scrollTo(0, 0);
        const groupHeading = section === "schedule" && ["overdue", "soon"].includes(ref)
          ? document.getElementById(`group-title-${ref}`) : null;
        if (groupHeading) {
          groupHeading.tabIndex = -1;
          groupHeading.focus();
        } else {
          main.focus({ preventScroll: true });
        }
      }

      clearTimeout(openingTimeout);
      app.classList.remove("opening");
      if (firstRender && onOverview && !motion.matches) playEntrance();
      firstRender = false;
      syncVideo();
    }

    function playEntrance() {
      app.classList.add("opening");
      const numbers = [...main.querySelectorAll("[data-count]")];
      const start = performance.now();
      function tick(now) {
        if (!app.classList.contains("opening")) return;
        const elapsed = now - start;
        numbers.forEach(element => {
          const delay = element.closest(".chips") ? 620 : 1320;
          const progress = Math.max(0, Math.min(1, (elapsed - delay) / 1280));
          element.textContent = Math.round(Number(element.dataset.count) * (1 - (1 - progress) ** 3));
        });
        if (elapsed < 2600) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      openingTimeout = setTimeout(() => app.classList.remove("opening"), 2800);
    }

    function syncVideo() {
      if (motion.matches || !app.classList.contains("home") || document.hidden) {
        video.pause();
        if (motion.matches) video.classList.remove("ready");
        return;
      }
      video.muted = true;
      if (!video.getAttribute("src")) video.src = video.dataset.source;
      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) video.classList.add("ready");
      video.play().catch(() => video.classList.remove("ready"));
    }

    function showResults(input) {
      const results = document.getElementById("generator-results");
      const announcement = document.getElementById("search-announcement");
      const query = input.value.trim();
      if (!query) {
        results.hidden = true;
        announcement.textContent = "";
        return;
      }
      const units = getFleet().filter(unit => filterMatches(query, unit.ref, unit.client.name, unit.client.location, unit.model, unit.location));
      results.innerHTML = units.map(unit => `<a href="${unitLink(unit)}">
        <span><strong>${escapeHtml(unit.ref)}</strong> · ${escapeHtml(unit.model)}<small>${escapeHtml(unit.client.name)} · ${escapeHtml(unit.location)}</small></span>
        ${icon("chevron")}
      </a>`).join("") || "<p>No generators found.</p>";
      results.hidden = false;
      announcement.textContent = units.length ? `${units.length} ${units.length === 1 ? "generator found" : "generators found"}` : "No generators found.";
    }

    function openServiceForm(ref) {
      const unit = getFleet().find(item => item.ref === ref);
      if (!unit) return;
      formGenerator = ref;
      serviceForm.reset();
      const fields = serviceForm.elements;
      fields.serviceDate.value = iso(today());
      fields.technician.value = technician;
      fields.nextDate.min = fields.serviceDate.value;
      fields.nextDate.setCustomValidity("");
      fields.work.setCustomValidity("");
      fields.technician.setCustomValidity("");
      serviceForm.querySelector(".form-error").hidden = true;
      document.getElementById("service-form-unit").textContent = `${unit.ref} · ${unit.client.name}`;
      serviceDialog.showModal();
    }

    function formError(form, message) {
      const error = form.querySelector(".form-error");
      error.textContent = message;
      error.hidden = false;
    }

    function showToast(message) {
      toast.innerHTML = `${icon("check")}<span>${escapeHtml(message)}</span>`;
      toast.hidden = false;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.hidden = true; }, 3600);
    }

    function withStorageLock(action) {
      if (navigator.locks?.request) return navigator.locks.request(storageKey, action);
      return action();
    }

    serviceForm.addEventListener("input", event => {
      const fields = serviceForm.elements;
      if (event.target === fields.serviceDate) fields.nextDate.min = fields.serviceDate.value;
      if (event.target === fields.serviceDate || event.target === fields.nextDate) fields.nextDate.setCustomValidity("");
      if (event.target === fields.technician || event.target === fields.work) event.target.setCustomValidity("");
      serviceForm.querySelector(".form-error").hidden = true;
    });

    serviceForm.addEventListener("submit", async event => {
      event.preventDefault();
      const fields = serviceForm.elements;
      const submit = event.submitter || serviceForm.querySelector("[type=submit]");
      if (submit.disabled) return;

      const serviceDate = fields.serviceDate.value;
      const nextDate = fields.nextDate.value;
      const name = fields.technician.value.trim();
      const work = fields.work.value.trim();
      fields.technician.setCustomValidity(name ? "" : "Enter the technician’s name.");
      fields.work.setCustomValidity(work ? "" : "Describe the work completed.");
      const validDates = Number.isFinite(dateNumber(serviceDate)) && Number.isFinite(dateNumber(nextDate));
      fields.nextDate.setCustomValidity(validDates && dateNumber(nextDate) >= dateNumber(serviceDate)
        ? "" : "Choose a next service date on or after the service date.");
      if (!serviceForm.reportValidity()) return;

      const ref = formGenerator;
      const id = globalThis.crypto?.randomUUID?.() || `${ref}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const record = { id, serviceDate, nextDate, technician: name, work };
      submit.disabled = true;
      try {
        await withStorageLock(() => {
          const saved = readData() ?? data;
          const next = saved.map(unit => unit.ref === ref ? { ...unit, records: [record, ...unit.records] } : unit);
          saveData(next);
        });
        serviceDialog.close();
        render();
        main.querySelector('[data-action="record"]')?.focus({ preventScroll: true });
        showToast(`Service saved for ${ref}.`);
      } catch {
        formError(serviceForm, "The service could not be saved. Check that browser storage is available and try again.");
      } finally {
        submit.disabled = false;
      }
    });

    document.querySelector("#reset-form").addEventListener("submit", async event => {
      event.preventDefault();
      const submit = event.submitter || event.currentTarget.querySelector("[type=submit]");
      if (submit.disabled) return;
      submit.disabled = true;
      try {
        await withStorageLock(() => saveData(seedData()));
        logFilter = "";
        selectedFrame = "month";
        resetDialog.close();
        if (currentRoute()[0] === "overview") render({ focus: true });
        else location.hash = "overview";
        showToast("Demo data restored.");
      } catch {
        formError(resetDialog, "Browser storage is unavailable. The demo data could not be reset.");
      } finally {
        submit.disabled = false;
      }
    });

    document.addEventListener("click", event => {
      const skip = event.target.closest(".skip-link");
      const action = event.target.closest("[data-action]");
      const frame = event.target.closest("[data-frame]");
      const nav = event.target.closest(".mast a");
      const dropdown = document.getElementById("generator-results");
      if (dropdown && !event.target.closest(".search-card")) dropdown.hidden = true;

      if (skip) {
        event.preventDefault();
        main.focus();
      }
      if (frame) {
        selectedFrame = frame.dataset.frame;
        document.querySelectorAll("[data-frame]").forEach(button => {
          button.setAttribute("aria-pressed", String(button === frame));
        });
        const now = today();
        document.getElementById("schedule-chart").innerHTML = chart(getFleet(now), now);
      }
      if (action?.dataset.action === "record") openServiceForm(action.dataset.unit);
      if (action?.dataset.action === "reset") {
        resetDialog.querySelector(".form-error").hidden = true;
        resetDialog.showModal();
      }
      if (action?.dataset.action === "close-dialog") action.closest("dialog").close();
      if (nav?.hash === location.hash) window.scrollTo(0, 0);
    });

    main.addEventListener("input", event => {
      if (event.target.id === "generator-search") showResults(event.target);
      if (event.target.id === "log-search") {
        logFilter = event.target.value;
        document.getElementById("log-entries").innerHTML = logEntries(getFleet());
      }
    });

    main.addEventListener("focusin", event => {
      if (event.target.id === "generator-search" && event.target.value) showResults(event.target);
    });

    main.addEventListener("keydown", event => {
      const results = document.getElementById("generator-results");
      if (!results || results.hidden || !event.target.closest(".search-card")) return;
      const input = document.getElementById("generator-search");
      const firstLink = results.querySelector("a");
      if (event.key === "Escape") {
        input.focus();
        results.hidden = true;
        event.preventDefault();
      }
      if (event.target === input && firstLink && (event.key === "ArrowDown" || event.key === "Enter")) {
        event.preventDefault();
        if (event.key === "Enter") firstLink.click();
        else firstLink.focus();
      }
    });

    let renderedDay = today();
    function checkDate() {
      if (today() !== renderedDay) {
        renderedDay = today();
        render();
      }
    }

    window.addEventListener("hashchange", () => render({ focus: true }));
    window.addEventListener("storage", event => {
      if (event.key !== storageKey && event.key !== null) return;
      data = readData() ?? seedData();
      render();
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkDate();
      syncVideo();
    });
    setInterval(checkDate, 60_000);
    motion.addEventListener("change", () => render());
    video.addEventListener("loadeddata", () => {
      if (!motion.matches) video.classList.add("ready");
    });
    video.addEventListener("error", () => video.classList.remove("ready"));

    try {
      if (!readData()) saveData(data);
    } catch {
      // Keep the seeded data in memory for a read-only demo.
    }
    render();
  </script>
</body>
</html>
